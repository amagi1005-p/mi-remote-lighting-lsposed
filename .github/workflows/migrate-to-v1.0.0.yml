name: Migrate initial public release to v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-to-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify both signed APK filenames
        run: cd releases && sha256sum --check SHA256SUMS.txt

      - name: Rename the original release, preserving signed binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v1.0.0" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view v1.0.0 >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq '.id')"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name="v1.0.0 - Mi Remote Lighting (First Public Release)" \
              -f body="$(cat docs/RELEASE_NOTES.md)" >/dev/null
          elif gh release view v0.2.0 >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.0" --jq '.id')"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name="v1.0.0" \
              -f name="v1.0.0 - Mi Remote Lighting (First Public Release)" \
              -f body="$(cat docs/RELEASE_NOTES.md)" >/dev/null
          else
            gh release create v1.0.0 releases/IRLightLSPosed-MiRemote-7.1.3G-v1.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "v1.0.0 - Mi Remote Lighting (First Public Release)" \
              --notes-file docs/RELEASE_NOTES.md
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq '.id')"
          fi

          OLD_ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "IRLightLSPosed-MiRemote-7.1.3G-v2.apk") | .id')"
          if [ -n "$OLD_ASSET_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ASSET_ID" \
              -f name="IRLightLSPosed-MiRemote-7.1.3G-v1.0.0.apk" >/dev/null
          fi

          if ! gh release view v1.0.0 --json assets --jq '.assets[].name' | grep -Fxq 'IRLightLSPosed-MiRemote-7.1.3G-v1.0.0.apk'; then
            gh release upload v1.0.0 releases/IRLightLSPosed-MiRemote-7.1.3G-v1.0.0.apk
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.2.0" >/dev/null
          fi

          gh release view v1.0.0 --json name,tagName,assets
