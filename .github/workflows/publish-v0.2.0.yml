name: Publish v0.2.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish verified signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify signed APK checksum
        run: cd releases && sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists."
            exit 0
          fi
          gh release create v0.2.0             releases/IRLightLSPosed-MiRemote-7.1.3G-v2.apk             --title "v0.2.0 - Mi Remote 7.1.3G Lighting"             --notes "Mi Remote 7.1.3G向けLSPosedモジュール。隠れている電球・照明カテゴリ (ID 14) を表示します。カテゴリ表示と赤外線による照明操作の動作報告があります。Vectorでも利用可能との報告があります（構成ごとの動作保証はありません）。LSPosedの適用先は com.duokan.phone.remotecontroller のみ。ほかのバージョンや機器は未検証です。"             --target "${GITHUB_SHA}"
